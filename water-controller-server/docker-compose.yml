# Water controller server stack: PostgreSQL database + API.
# Usage: docker compose up -d
services:
  db:
    build: ./database
    container_name: water-controller-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d water_controller"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    container_name: water-controller-api
    environment:
      # Override the localhost connection string from appsettings.json so the
      # API talks to the db service on the compose network.
      ConnectionStrings__WaterController: Host=db;Port=5432;Database=water_controller;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
